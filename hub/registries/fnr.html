<script>
(async () => {
  const T = 'fnr_patients', PREFIX = 'FNR', esc = SL.esc;

  /* ---------------- field dictionaries (kept from legacy) ---------------- */
  const CATS = ['Epilepsy', 'DBS', 'Pain', 'Spasticity', 'Other'];
  const SEX = ['Male', 'Female', 'Other'], RACE = [['White', 'White'], ['Black', 'Black or African American'], ['Asian', 'Asian'], ['AIAN', 'American Indian / Alaska Native'], ['NHPI', 'Native Hawaiian / Pacific Islander'], ['Other', 'Other'], ['Unknown', 'Unknown']], ETH = [['Hispanic', 'Hispanic or Latino'], ['Non-Hispanic', 'Not Hispanic or Latino'], ['Unknown', 'Unknown']];
  const PROCS = { Epilepsy: [['ATL', 'Anterior temporal lobectomy'], ['SAH', 'Selective amygdalohippocampectomy'], ['Lesionectomy', 'Lesionectomy'], ['Hemispherectomy', 'Hemispherectomy'], ['Corpus Callosotomy', 'Corpus callosotomy'], ['LITT', 'Laser ablation (LITT)'], ['VNS Implant', 'VNS implant'], ['RNS Implant', 'RNS implant']],

    Pain: [['SCS Implant', 'SCS implant'], ['SCS Trial', 'SCS trial'], ['DRG Stimulation', 'DRG stimulation'], ['MVD', 'Microvascular decompression'], ['Rhizotomy', 'Percutaneous rhizotomy'], ['Gamma Knife TN', 'Gamma Knife (TN)'], ['Motor Cortex Stim', 'Motor cortex stimulation'], ['ITB Pump', 'Intrathecal baclofen pump']],
    Spasticity: [['ITB Pump Implant', 'ITB pump implant'], ['SDR', 'Selective dorsal rhizotomy'], ['ITB Pump Revision', 'ITB pump revision']] };
  const ALL_PROCS = Object.values(PROCS).flat();
  const ENGEL = [['IA', 'IA — seizure free'], ['IB', 'IB — non-disabling simple partial only'], ['IC', 'IC — some disabling seizures, then free ≥2 y'], ['ID', 'ID — generalized only with AED withdrawal'], ['II', 'II — rare disabling seizures'], ['III', 'III — worthwhile improvement'], ['IV', 'IV — no worthwhile improvement']];
  const ENGEL_KEYS = ENGEL.map((e) => e[0]);
  const TARGETS = ['STN', 'GPi', 'VIM', 'ANT', 'Other'];
  const MFG = [['Medtronic', 'Medtronic'], ['Boston Scientific', 'Boston Scientific'], ['Abbott', 'Abbott (St. Jude)'], ['NeuroPace', 'NeuroPace'], ['LivaNova', 'LivaNova'], ['Nevro', 'Nevro'], ['Other', 'Other']];
  const BATTERY = ['Full', 'Adequate', 'Low', 'ERI', 'Rechargeable'], DEV_STATUS = ['Active', 'Inactive', 'Replaced', 'Explanted'];
  const when = (cats) => ({ key: 'category', in: cats });

  const STEPS = [
    { title: 'Category & demographics', fields: [
      { key: 'study_id', label: 'Study ID', type: 'text', placeholder: 'Leave blank to auto-generate (FNR-0001)', help: 'Auto-generated on save when blank. Never use an MRN.' },
      { key: 'category', label: 'Category', type: 'select', options: CATS, required: true, help: 'Drives the disease-specific fields in steps 2, 3 and 6.' },
      { key: 'age_at_surgery', label: 'Age at surgery', type: 'number', min: 0, max: 120 }, { key: 'sex', label: 'Sex', type: 'select', options: SEX }, { key: 'race', label: 'Race', type: 'select', options: RACE }, { key: 'ethnicity', label: 'Ethnicity', type: 'select', options: ETH },
      { key: 'referring_physician', label: 'Referring physician', type: 'text' } ] },
    { title: 'Disease-specific history', intro: 'Fields shown depend on the category chosen in step 1.', fields: [
      { key: 'epilepsy_type', label: 'Epilepsy type', type: 'select', options: [['Focal', 'Focal'], ['Generalized', 'Generalized'], ['Combined', 'Combined focal & generalized'], ['Unknown', 'Unknown']], when: when(['Epilepsy']) }, { key: 'etiology', label: 'Etiology', type: 'select', options: [['MTS', 'Mesial temporal sclerosis'], ['FCD', 'Focal cortical dysplasia'], ['Tumor-related', 'Tumor-related'], ['Vascular', 'Vascular'], ['Post-traumatic', 'Post-traumatic'], ['Post-infectious', 'Post-infectious'], ['Genetic', 'Genetic'], ['Unknown', 'Unknown / cryptogenic']], when: when(['Epilepsy']) },
      { key: 'seizure_onset_age', label: 'Seizure onset age', type: 'number', min: 0, max: 120, when: when(['Epilepsy']) }, { key: 'seizure_frequency', label: 'Seizure frequency (per month)', type: 'number', min: 0, when: when(['Epilepsy']) }, { key: 'failed_aeds', label: 'Failed AEDs (count)', type: 'number', min: 0, when: when(['Epilepsy']) }, { key: 'seizure_semiology', label: 'Seizure semiology', type: 'textarea', full: true, when: when(['Epilepsy']) },
      { key: 'dbs_indication', label: 'DBS indication', type: 'select', options: [["Parkinson's Disease", "Parkinson's disease"], ['Essential Tremor', 'Essential tremor'], ['Dystonia', 'Dystonia'], ['OCD', 'OCD'], ['Epilepsy', 'Epilepsy (ANT-DBS)'], ['Tourette', 'Tourette syndrome'], ['Other', 'Other']], when: when(['DBS']) }, { key: 'disease_duration', label: 'Disease duration (years)', type: 'number', min: 0, when: when(['DBS']) },
      { key: 'updrs_pre', label: 'UPDRS-III pre-op (off)', type: 'number', min: 0, max: 132, step: '0.5', when: when(['DBS']) }, { key: 'hoehn_yahr', label: 'Hoehn & Yahr', type: 'select', options: ['1', '1.5', '2', '2.5', '3', '4', '5'], when: when(['DBS']) }, { key: 'ldopa_response', label: 'Levodopa response (%)', type: 'number', min: 0, max: 100, when: when(['DBS']) },
      { key: 'pain_diagnosis', label: 'Pain diagnosis', type: 'select', options: [['Trigeminal Neuralgia', 'Trigeminal neuralgia'], ['Failed Back Surgery Syndrome', 'Failed back surgery syndrome'], ['CRPS', 'CRPS'], ['Neuropathic Pain', 'Neuropathic pain'], ['Central Pain', 'Central pain syndrome'], ['Cancer Pain', 'Cancer pain'], ['Other', 'Other']], when: when(['Pain']) }, { key: 'pain_duration', label: 'Pain duration (years)', type: 'number', min: 0, when: when(['Pain']) }, { key: 'pain_location', label: 'Pain location', type: 'text', when: when(['Pain']) }, { key: 'vas_pre', label: 'VAS pre-op (0-10)', type: 'number', min: 0, max: 10, step: '0.5', when: when(['Pain']) }, { key: 'prior_interventions', label: 'Prior interventions', type: 'textarea', full: true, when: when(['Pain']) },
      { key: 'spasticity_etiology', label: 'Spasticity etiology', type: 'select', options: [['Cerebral Palsy', 'Cerebral palsy'], ['Stroke', 'Stroke'], ['TBI', 'Traumatic brain injury'], ['Spinal Cord Injury', 'Spinal cord injury'], ['MS', 'Multiple sclerosis'], ['Other', 'Other']], when: when(['Spasticity']) }, { key: 'spasticity_distribution', label: 'Distribution', type: 'select', options: ['Hemiplegic', 'Diplegic', 'Quadriplegic', 'Focal'], when: when(['Spasticity']) }, { key: 'ashworth_pre', label: 'Modified Ashworth pre-op (0-4)', type: 'number', min: 0, max: 4, step: '0.5', when: when(['Spasticity']) } ] },
    { title: 'Pre-operative evaluation', intro: 'Fields shown depend on the category chosen in step 1.', fields: [

      { key: 'dbs_neuropsych', label: 'Neuropsychology', type: 'select', options: [['Normal', 'Normal'], ['Mild impairment', 'Mild cognitive impairment'], ['Moderate impairment', 'Moderate impairment'], ['Not done', 'Not done']], when: when(['DBS']) }, { key: 'dbs_mri', label: 'MRI', type: 'select', options: [['Normal', 'Normal'], ['Atrophy', 'Atrophy'], ['Abnormal', 'Other abnormality']], when: when(['DBS']) },
      { key: 'pain_psych_eval', label: 'Psychological evaluation', type: 'select', options: [['Cleared', 'Cleared'], ['Concerns noted', 'Concerns noted'], ['Not done', 'Not done']], when: when(['Pain']) },
      { key: 'baclofen_trial', label: 'Intrathecal baclofen trial', type: 'select', options: [['Positive', 'Positive response'], ['Partial', 'Partial response'], ['Negative', 'Negative'], ['Not done', 'Not done']], when: when(['Spasticity']) } ] },
    { title: 'Surgery / procedure', fields: [

      { key: 'lead_model', label: 'Lead model', type: 'text' }, { key: 'ipg_location', label: 'IPG location', type: 'text', placeholder: 'e.g. Left infraclavicular' }, { key: 'battery_status', label: 'Battery status', type: 'select', options: BATTERY }, { key: 'device_status', label: 'Device status', type: 'select', options: DEV_STATUS } ] },
    { title: 'Outcomes (if known)', intro: 'Post-operative scores can be added or updated later from the patient record.', fields: [
      { key: 'engel_class', label: 'Engel class', type: 'select', options: ENGEL, when: when(['Epilepsy']) }, { key: 'seizure_free', label: 'Seizure free', type: 'boolean', when: when(['Epilepsy']) },
      { key: 'updrs_post', label: 'UPDRS-III post-op (on stim / off med)', type: 'number', min: 0, max: 132, step: '0.5', when: when(['DBS']) },
      { key: 'vas_post', label: 'VAS post-op (0-10)', type: 'number', min: 0, max: 10, step: '0.5', when: when(['Pain']) },
      { key: 'ashworth_post', label: 'Modified Ashworth post-op (0-4)', type: 'number', min: 0, max: 4, step: '0.5', when: when(['Spasticity']) } ] },
  ];
  const ALL_FIELDS = STEPS.flatMap((s) => s.fields);
  const ALL_COLS = ALL_FIELDS.map((f) => f.key).concat(['dbs_target']);
  const OUTCOME_FIELDS = STEPS[5].fields.concat(STEPS[4].fields.filter((f) => ['battery_status', 'device_status'].includes(f.key)));
  /** Local helper: derive dbs_target from a DBS procedure code (legacy behaviour). */
  const deriveTarget = (vals) => { const pr = vals.procedure_type || ''; if (pr.startsWith('DBS-')) vals.dbs_target = pr.slice(4); return vals; };

  /* ---------------- derived values & badges ---------------- */
  const catTag = (c) => c ? REG.tag(c, { Epilepsy: 'info', DBS: 'teal', Pain: 'warn', Spasticity: 'ok' }[c] || 'outline') : REG.tag('—', 'outline');
  const engelTag = (e) => { if (!e) return REG.tag('—', 'outline'); const k = String(e).toUpperCase(); return REG.tag('Engel ' + k + (k === 'IA' ? ' · seizure free' : ''), k.startsWith('I') && k.length === 2 ? 'ok' : k === 'II' ? 'teal' : k === 'III' ? 'warn' : 'danger'); };
  const isSeizureFree = (p) => p.seizure_free === true || p.engel_class === 'IA';
  const improvement = (pre, post) => (pre == null || post == null || +pre === 0) ? null : Math.round((pre - post) / pre * 100);
  const updrsTag = (p) => { const v = improvement(p.updrs_pre, p.updrs_post); return v == null ? REG.tag('—', 'outline') : REG.tag(v + '%', v >= 50 ? 'ok' : v >= 30 ? 'warn' : 'danger'); };
  const vasTag = (v) => v == null || v === '' ? REG.tag('—', 'outline') : REG.tag((+v).toFixed(1), +v <= 3 ? 'ok' : +v <= 5 ? 'teal' : +v <= 7 ? 'warn' : 'danger');
  const ashTag = (v) => v == null || v === '' ? REG.tag('—', 'outline') : REG.tag(String(v), +v <= 1 ? 'ok' : +v <= 2 ? 'teal' : +v <= 3 ? 'warn' : 'danger');
  const devTag = (s) => s ? REG.tag(s, { Active: 'ok', Full: 'ok', Adequate: 'teal', Rechargeable: 'info', Low: 'warn', ERI: 'danger', Inactive: 'outline', Replaced: 'warn', Explanted: 'danger' }[s] || 'outline') : REG.tag('—', 'outline');
  const outcomeCell = (p) => p.category === 'Epilepsy' ? engelTag(p.engel_class) : p.category === 'DBS' ? updrsTag(p) : p.category === 'Pain' ? (p.vas_post != null ? 'VAS ' + vasTag(p.vas_post) : REG.tag('—', 'outline')) : p.category === 'Spasticity' ? (p.ashworth_post != null ? 'MAS ' + ashTag(p.ashworth_post) : REG.tag('—', 'outline')) : REG.tag('—', 'outline');
  const hasOutcome = (p) => !!p.engel_class || p.updrs_post != null || p.vas_post != null || p.ashworth_post != null;
  const unit = (v, u) => v == null || v === '' ? null : v + ' ' + u;
  const yr = (d) => d ? String(d).slice(0, 4) : null;
  const monthDate = (m) => m ? new Date(String(m).slice(0, 7) + '-01T12:00:00') : null;

  const LIST_COLS = [
    { key: 'study_id', label: 'Study ID', render: (p) => REG.studyLink(p.study_id) }, { key: 'age_at_surgery', label: 'Age', num: true }, { key: 'sex', label: 'Sex' }, { key: 'category', label: 'Category', render: (p) => catTag(p.category) }, { key: 'procedure_type', label: 'Procedure' },
    { key: 'surgery_date', label: 'Surgery', render: (p) => REG.date(p.surgery_date) }, { key: 'surgeon', label: 'Surgeon' }, { key: 'device_manufacturer', label: 'Device', render: (p) => REG.val(p.device_manufacturer ? [p.device_manufacturer, p.device_model].filter(Boolean).join(' ') : '—') }, { key: 'outcome', label: 'Outcome', sortable: false, render: outcomeCell },
  ];
  const CSV_COLS = ['study_id', 'category', 'age_at_surgery', 'sex', 'race', 'ethnicity', 'surgery_date', 'surgeon', 'procedure_type', 'laterality', 'surgical_target', 'epilepsy_type', 'etiology', 'seizure_frequency', 'failed_aeds', 'intracranial_monitoring', 'engel_class', 'seizure_free', 'dbs_indication', 'dbs_target', 'updrs_pre', 'updrs_post', 'hoehn_yahr', 'pain_diagnosis', 'pain_location', 'vas_pre', 'vas_post', 'spasticity_etiology', 'ashworth_pre', 'ashworth_post', 'device_manufacturer', 'device_model', 'device_implant_date', 'battery_status', 'device_status'];
  const openDetail = (p) => REG.go('detail', { id: p.study_id });
  const patients = (force) => REG.fetchAll(T, { force, order: 'study_id' });

  /* ---------------- related tables (detail) ---------------- */
  const PROG_FIELDS = [{ key: 'session_date', label: 'Session date', type: 'date', required: true }, { key: 'device_type', label: 'Device type', type: 'select', options: ['DBS', 'RNS', 'VNS', 'SCS', 'DRG', 'ITB'], required: true }, { key: 'amplitude', label: 'Amplitude (mA / V)', type: 'number', min: 0, step: '0.1' }, { key: 'pulse_width', label: 'Pulse width (µs)', type: 'number', min: 0 }, { key: 'frequency', label: 'Frequency (Hz)', type: 'number', min: 0 }, { key: 'contacts', label: 'Active contacts', type: 'text', placeholder: 'e.g. 1-C+, 2-' }, { key: 'impedance', label: 'Impedance (Ω)', type: 'number', min: 0 }, { key: 'notes', label: 'Notes', type: 'textarea', full: true }];
  const seizureChart = (el, rows) => { const pts = rows.filter((r) => r.month_year && r.seizure_count != null).map((r) => ({ x: monthDate(r.month_year), y: +r.seizure_count })).sort((a, b) => a.x - b.x); REG.line(el, [{ label: 'Seizures / month', color: REG.SERIES[0], points: pts }], { xTime: true, xFormat: d3.timeFormat('%b %Y'), yLabel: 'seizures / month', unit: 'seizures', height: 200, empty: 'No seizure log entries' }); };
  const REL = {
    programming: { table: 'fnr_device_programming', title: 'Programming sessions', order: 'session_date', asc: false, fields: PROG_FIELDS, cols: [{ key: 'session_date', label: 'Date', render: (r) => REG.date(r.session_date) }, { key: 'device_type', label: 'Device' }, { key: 'amplitude', label: 'Amplitude', num: true, render: (r) => REG.val(r.amplitude, 'mA') }, { key: 'pulse_width', label: 'PW', num: true, render: (r) => REG.val(r.pulse_width, 'µs') }, { key: 'frequency', label: 'Freq', num: true, render: (r) => REG.val(r.frequency, 'Hz') }, { key: 'contacts', label: 'Contacts' }, { key: 'impedance', label: 'Impedance', num: true, render: (r) => REG.val(r.impedance, 'Ω') }, { key: 'notes', label: 'Notes' }] },
    seizures: { table: 'fnr_seizure_logs', title: 'Seizure log', order: 'month_year', asc: false, cols: [{ key: 'month_year', label: 'Month', render: (r) => r.month_year ? SL.fmtDate(String(r.month_year).slice(0, 7) + '-01', { year: 'numeric', month: 'long' }) : '—' }, { key: 'seizure_count', label: 'Seizures', num: true, render: (r) => r.seizure_count == null ? '—' : (+r.seizure_count === 0 ? REG.tag('0', 'ok') : `<strong>${esc(r.seizure_count)}</strong>`) }, { key: 'notes', label: 'Notes' }],
      fields: [{ key: 'month_year', label: 'Month', type: 'month', required: true }, { key: 'seizure_count', label: 'Seizure count', type: 'number', min: 0, required: true }, { key: 'notes', label: 'Notes', type: 'textarea', full: true }], chart: seizureChart },
    meds: { table: 'fnr_medications', title: 'Medications', order: 'start_date', asc: false, cols: [{ key: 'medication_name', label: 'Medication', render: (r) => `<strong>${REG.val(r.medication_name)}</strong>` }, { key: 'medication_type', label: 'Type' }, { key: 'dose', label: 'Dose' }, { key: 'start_date', label: 'Start', render: (r) => REG.date(r.start_date) }, { key: 'end_date', label: 'End', render: (r) => r.end_date ? REG.date(r.end_date) : '<span class="muted">Current</span>' }, { key: 'status', label: 'Status', sortable: false, render: (r) => r.end_date ? REG.tag('Discontinued', 'outline') : REG.tag('Active', 'ok') }],
      fields: [{ key: 'medication_name', label: 'Medication', type: 'text', required: true, placeholder: 'e.g. Levetiracetam' }, { key: 'medication_type', label: 'Type', type: 'select', options: [['AED', 'Anti-seizure medication'], ['Dopaminergic', 'Dopaminergic'], ['Pain', 'Pain medication'], ['Antispasmodic', 'Antispasmodic'], ['Other', 'Other']] }, { key: 'dose', label: 'Dose', type: 'text', placeholder: 'e.g. 500 mg BID' }, { key: 'start_date', label: 'Start date', type: 'date' }, { key: 'end_date', label: 'End date (if discontinued)', type: 'date' }] },
    outcomes: { table: 'fnr_outcome_assessments', title: 'Outcome assessments', order: 'assessment_date', asc: false, cols: [{ key: 'assessment_date', label: 'Date', render: (r) => REG.date(r.assessment_date) }, { key: 'assessment_type', label: 'Instrument' }, { key: 'score', label: 'Score', render: (r) => `<strong>${REG.val(r.score)}</strong>` }, { key: 'timepoint', label: 'Timepoint' }, { key: 'notes', label: 'Notes' }],
      fields: [{ key: 'assessment_type', label: 'Instrument', type: 'select', options: [['Engel', 'Engel class'], ['UPDRS', 'UPDRS-III'], ['VAS', 'VAS'], ['Ashworth', 'Modified Ashworth'], ['QOLIE-31', 'QOLIE-31'], ['QOLIE-89', 'QOLIE-89'], ['PDQ-39', 'PDQ-39'], ['ODI', 'Oswestry (ODI)'], ['Other', 'Other']], required: true }, { key: 'score', label: 'Score / value', type: 'text', required: true }, { key: 'assessment_date', label: 'Assessment date', type: 'date', required: true }, { key: 'timepoint', label: 'Timepoint', type: 'select', options: ['Baseline', '3 months', '6 months', '12 months', '24 months', '36 months', 'Other'] }, { key: 'notes', label: 'Notes', type: 'textarea', full: true }] },

  /* ---------- dashboard ---------- */
  async function dashboard(el) {

    const subScores = {}; Object.keys(sub).forEach((k) => { const rows = pts.filter((p) => p.category === k); const r = REG.completeness(rows, { x: sub[k] }); subScores[k + ' fields'] = { pct: rows.length ? r.avg : 0, n: rows.length, fields: r.fieldScores }; });

      `<div class="chart-grid">${REG.section('Completeness by category', Object.keys(allCat).map((k) => `<div class="qrow"><span>${esc(k)}${subScores[k] ? ` <span class="xs muted">(n=${subScores[k].n})</span>` : k === 'Device' ? ` <span class="xs muted">(n=${devPts.length} with device)</span>` : ''}</span>${REG.progressBar(allCat[k])}<span class="pct">${allCat[k]}%</span></div>`).join(''))}${REG.section('Patients by core completeness band', '<div class="chart" id="qPie"></div>')}</div>
      <div class="chart-grid">${REG.section('Fields below 50% coverage', '<div id="qCrit"></div>')}${REG.section('Least complete records (core fields)', '<div id="qWorst"></div>')}</div>`;
    const bands = { 'Excellent (≥80%)': 0, 'Good (60–79%)': 0, 'Fair (40–59%)': 0, 'Poor (<40%)': 0 }; c.perPatient.forEach((x) => { if (x.pct >= 80) bands['Excellent (≥80%)']++; else if (x.pct >= 60) bands['Good (60–79%)']++; else if (x.pct >= 40) bands['Fair (40–59%)']++; else bands['Poor (<40%)']++; });
    REG.donut(el.querySelector('#qPie'), REG.toData(bands), { colorFor: (l) => l.startsWith('Exc') ? REG.STATUS.ok : l.startsWith('Good') ? REG.STATUS.info : l.startsWith('Fair') ? REG.STATUS.warn : REG.STATUS.danger, empty: 'No patients' });
    const fieldRows = Object.keys(c.fieldScores).filter((f) => !cats.Device.includes(f)).map((f) => ({ field: f, scope: 'All', pct: c.fieldScores[f] })).concat(Object.keys(devC.fieldScores).map((f) => ({ field: f, scope: 'Devices', pct: devPts.length ? devC.fieldScores[f] : 0 }))).concat(Object.keys(subScores).flatMap((k) => Object.keys(subScores[k].fields).map((f) => ({ field: f, scope: k.replace(' fields', ''), pct: subScores[k].n ? subScores[k].fields[f] : 0 }))));
    REG.table(el.querySelector('#qCrit'), [{ key: 'field', label: 'Field', render: (r) => `<code>${esc(r.field)}</code>` }, { key: 'scope', label: 'Scope' }, { key: 'pct', label: 'Coverage', num: true, render: (r) => r.pct + '%' }, { key: 'bar', label: '', sortable: false, render: (r) => REG.progressBar(r.pct) }], fieldRows.filter((r) => r.pct < 50).sort((a, b) => a.pct - b.pct), { empty: pts.length ? 'All fields are above 50% coverage.' : 'No patients yet.', sticky: false });
    REG.table(el.querySelector('#qWorst'), [{ key: 'study_id', label: 'Study ID', render: (r) => REG.studyLink(r.row.study_id) }, { key: 'cat', label: 'Category', render: (r) => catTag(r.row.category) }, { key: 'pct', label: 'Complete', num: true, render: (r) => r.pct + '%' }, { key: 'missing', label: 'Missing', sortable: false, render: (r) => `<span class="xs muted">${esc(r.missing.slice(0, 5).join(', '))}${r.missing.length > 5 ? ` +${r.missing.length - 5}` : ''}</span>` }], c.perPatient.slice().sort((a, b) => a.pct - b.pct).slice(0, 15), { empty: 'No patients yet.', sticky: false });
  }

  await REG.init({ registry: 'fnr', title: 'Functional Neurosurgery Registry', subtitle: 'Epilepsy surgery (Engel) · DBS (UPDRS) · pain (VAS) · spasticity (Ashworth) · devices & programming', prefix: PREFIX, table: T, pages: PAGES, defaultPage: 'dashboard',
    render: (page, params, el) => ({ dashboard, epilepsy, dbs, pain, query, add, detail, devices, outcomes, quality })[page](el, params) });
})();
</script>
