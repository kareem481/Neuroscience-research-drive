<script>
(async () => {
  const T = 'tbi_patients', PREFIX = 'TBI', esc = SL.esc;

  /* ---------------- field dictionaries (kept from legacy) ---------------- */
  const CATEGORIES = [['TBI', 'TBI (general)'], ['SDH', 'Subdural hematoma'], ['EDH', 'Epidural hematoma'], ['SAH-Traumatic', 'Traumatic SAH'], ['Skull Fracture', 'Skull fracture'], ['Penetrating', 'Penetrating injury'], ['Polytrauma', 'Polytrauma']];
  const CAT_KEYS = CATEGORIES.map((c) => c[0]);
  const SEX = ['Male', 'Female', 'Other'], RACE = [['White', 'White'], ['Black', 'Black or African American'], ['Asian', 'Asian'], ['AIAN', 'American Indian / Alaska Native'], ['NHPI', 'Native Hawaiian / Pacific Islander'], ['Other', 'Other'], ['Unknown', 'Unknown']], ETH = [['Hispanic', 'Hispanic or Latino'], ['Non-Hispanic', 'Not Hispanic or Latino'], ['Unknown', 'Unknown']];
  const MECH = [['MVC', 'Motor vehicle collision'], ['Motorcycle', 'Motorcycle crash'], ['Pedestrian', 'Pedestrian struck'], ['Fall', 'Fall'], ['Assault', 'Assault'], ['Sports', 'Sports injury'], ['GSW', 'Gunshot wound'], ['Bicycle', 'Bicycle'], ['Other', 'Other']];
  const ANTICOAG = ['Warfarin', 'Apixaban', 'Rivaroxaban', 'Dabigatran', 'Enoxaparin', 'Aspirin', 'Clopidogrel', 'Dual Antiplatelet', 'Other'];
  const PUPILS = [['Equal Reactive', 'Equal, reactive'], ['Unequal Reactive', 'Unequal but reactive'], ['Unilateral Fixed', 'Unilateral fixed / dilated'], ['Bilateral Fixed', 'Bilateral fixed / dilated']];
  const MARSHALL = [['I', 'I — no visible pathology'], ['II', 'II — cisterns present, shift <5 mm'], ['III', 'III — cisterns compressed/absent, shift <5 mm'], ['IV', 'IV — shift >5 mm, no mass'], ['V', 'V — evacuated mass lesion'], ['VI', 'VI — non-evacuated mass >25 cc']];
  const HERNIATION = ['None', 'Uncal', 'Subfalcine', 'Tonsillar', 'Upward', 'Multiple'];
  const SDH_TYPES = [['Acute', 'Acute'], ['Subacute', 'Subacute'], ['Chronic', 'Chronic'], ['Mixed', 'Mixed density']];
  const FRACTURES = ['Linear', 'Depressed', 'Basilar', 'Comminuted', 'Open/Compound'];
  const SURGERY = [['None', 'None (conservative)'], ['Craniotomy', 'Craniotomy for evacuation'], ['Decompressive Craniectomy', 'Decompressive craniectomy'], ['Burr Hole', 'Burr hole drainage'], ['Cranioplasty', 'Cranioplasty'], ['Elevation', 'Fracture elevation'], ['EVD', 'EVD placement'], ['Other', 'Other']];
  const GOS = [['1', '1 — Dead'], ['2', '2 — Vegetative state'], ['3', '3 — Severe disability'], ['4', '4 — Moderate disability'], ['5', '5 — Good recovery']];
  const GOSE = [['1', '1 — Dead'], ['2', '2 — Vegetative state'], ['3', '3 — Lower severe disability'], ['4', '4 — Upper severe disability'], ['5', '5 — Lower moderate disability'], ['6', '6 — Upper moderate disability'], ['7', '7 — Lower good recovery'], ['8', '8 — Upper good recovery']];
  const RANCHO = [['I', 'I — No response'], ['II', 'II — Generalized response'], ['III', 'III — Localized response'], ['IV', 'IV — Confused-agitated'], ['V', 'V — Confused-inappropriate'], ['VI', 'VI — Confused-appropriate'], ['VII', 'VII — Automatic-appropriate'], ['VIII', 'VIII — Purposeful-appropriate']];
  const DISPO = [['Home', 'Home'], ['Rehab', 'Acute rehab'], ['SNF', 'Skilled nursing'], ['LTAC', 'LTAC'], ['Deceased', 'Deceased'], ['Other', 'Other']];
  const COMPS = ['DVT', 'PE', 'Pneumonia', 'UTI', 'Seizure', 'Hydrocephalus', 'Wound Infection', 'Meningitis', 'CSF Leak', 'Coagulopathy'];
  const GOS_LABEL = { 1: 'Dead', 2: 'Vegetative', 3: 'Severe disability', 4: 'Moderate disability', 5: 'Good recovery' };
  const GOSE_LABEL = { 1: 'Dead', 2: 'VS', 3: 'L-SD', 4: 'U-SD', 5: 'L-MD', 6: 'U-MD', 7: 'L-GR', 8: 'U-GR' };
  const GOS_COLOR = { 'Dead': REG.NEUTRAL, 'Vegetative': REG.STATUS.danger, 'Severe disability': REG.STATUS.warn, 'Moderate disability': REG.SERIES[6], 'Good recovery': REG.STATUS.ok };
  const SEV_LABEL = { Severe: 'Severe (3-8)', Moderate: 'Moderate (9-12)', Mild: 'Mild (13-15)' };

  const STEPS = [
    { title: 'Category & demographics', fields: [
      { key: 'study_id', label: 'Study ID', type: 'text', placeholder: 'Leave blank to auto-generate (TBI-0001)', help: 'Auto-generated on save when blank. Never use an MRN.' },
      { key: 'category', label: 'Injury category', type: 'select', options: CATEGORIES, required: true },
      { key: 'age', label: 'Age', type: 'number', min: 0, max: 120 }, { key: 'sex', label: 'Sex', type: 'select', options: SEX }, { key: 'race', label: 'Race', type: 'select', options: RACE }, { key: 'ethnicity', label: 'Ethnicity', type: 'select', options: ETH },
      { key: 'injury_date', label: 'Injury date', type: 'date' }, { key: 'mechanism', label: 'Mechanism of injury', type: 'select', options: MECH }, { key: 'anticoagulation', label: 'Anticoagulation / antiplatelet', type: 'select', options: ANTICOAG, blank: 'None' } ] },
    { title: 'Field / ED assessment', fields: [
      { key: 'gcs_field', label: 'GCS (field)', type: 'number', min: 3, max: 15 }, { key: 'gcs_ed', label: 'GCS (ED)', type: 'number', min: 3, max: 15, help: 'Drives severity: 3-8 severe, 9-12 moderate, 13-15 mild.' },
      { key: 'gcs_eye', label: 'GCS eye', type: 'number', min: 1, max: 4 }, { key: 'gcs_verbal', label: 'GCS verbal', type: 'number', min: 1, max: 5 }, { key: 'gcs_motor', label: 'GCS motor', type: 'number', min: 1, max: 6 },
      { key: 'pupils', label: 'Pupils', type: 'select', options: PUPILS }, { key: 'intubated_field', label: 'Intubated in field', type: 'bool' },
      { key: 'sbp', label: 'SBP (mmHg)', type: 'number', min: 0, max: 300 }, { key: 'heart_rate', label: 'Heart rate (bpm)', type: 'number', min: 0, max: 300 }, { key: 'spo2', label: 'SpO₂ (%)', type: 'number', min: 0, max: 100 },
      { key: 'associated_injuries', label: 'Associated injuries', type: 'textarea', full: true, help: 'Clinical summary only — no identifiers.' } ] },
    { title: 'CT findings', fields: [

      { key: 'midline_shift', label: 'Midline shift (mm)', type: 'number', min: 0, step: '0.1' }, { key: 'herniation', label: 'Herniation', type: 'select', options: HERNIATION },
      { key: 'sdh_type', label: 'SDH', type: 'select', options: SDH_TYPES, blank: 'None' }, { key: 'sdh_thickness', label: 'SDH thickness (mm)', type: 'number', min: 0, step: '0.1' },
      { key: 'edh', label: 'EDH present', type: 'bool' }, { key: 'edh_volume', label: 'EDH volume (cc)', type: 'number', min: 0, step: '0.1' },
      { key: 'contusion', label: 'Contusion', type: 'select', options: ['Single', 'Multiple', 'Hemorrhagic'], blank: 'None' }, { key: 'dai', label: 'Diffuse axonal injury', type: 'select', options: ['Grade 1', 'Grade 2', 'Grade 3'], blank: 'None' },
      { key: 'traumatic_sah', label: 'Traumatic SAH', type: 'bool' }, { key: 'ivh', label: 'IVH', type: 'bool' },
      { key: 'fracture_type', label: 'Skull fracture type', type: 'select', options: FRACTURES, blank: 'None' }, { key: 'fracture_location', label: 'Fracture location', type: 'text', placeholder: 'e.g. Right temporal' } ] },
    { title: 'Surgery & ICP management', fields: [
      { key: 'surgery', label: 'Surgery', type: 'select', options: SURGERY }, { key: 'surgery_date', label: 'Surgery date', type: 'date' }, { key: 'surgeon', label: 'Surgeon', type: 'text' },
      { key: 'time_to_surgery', label: 'Time to surgery (hours)', type: 'number', min: 0, step: '0.1' }, { key: 'surgical_complications', label: 'Surgical complications', type: 'text', placeholder: 'None' },
      { key: 'evd', label: 'EVD placed', type: 'bool' }, { key: 'icp_monitor_type', label: 'ICP monitor', type: 'select', options: [['EVD', 'EVD'], ['Bolt', 'Parenchymal bolt'], ['Both', 'Both']], blank: 'None' },
      { key: 'hyperosmolar', label: 'Hyperosmolar therapy', type: 'select', options: [['Mannitol', 'Mannitol'], ['HTS', 'Hypertonic saline'], ['Both', 'Both']], blank: 'None' }, { key: 'decompressive_craniectomy', label: 'Decompressive craniectomy', type: 'bool' },
      { key: 'barbiturate_coma', label: 'Barbiturate coma', type: 'bool' }, { key: 'therapeutic_hypothermia', label: 'Therapeutic hypothermia', type: 'bool' } ] },
    { title: 'ICU course & outcomes', fields: [
      { key: 'icu_days', label: 'ICU days', type: 'number', min: 0 }, { key: 'ventilator_days', label: 'Ventilator days', type: 'number', min: 0 },
      { key: 'tracheostomy', label: 'Tracheostomy', type: 'bool' }, { key: 'peg_tube', label: 'PEG tube', type: 'bool' }, { key: 'vp_shunt', label: 'VP shunt', type: 'bool' },
      { key: 'complications', label: 'In-hospital complications', type: 'checks', full: true, options: COMPS },
      { key: 'gos', label: 'GOS', type: 'select', options: GOS }, { key: 'gos_e', label: 'GOS-E', type: 'select', options: GOSE }, { key: 'drs', label: 'DRS (0-29)', type: 'number', min: 0, max: 29 }, { key: 'rancho_level', label: 'Rancho level', type: 'select', options: RANCHO },
      { key: 'mortality', label: 'Mortality', type: 'bool' }, { key: 'brain_death', label: 'Brain death', type: 'bool' }, { key: 'organ_donor', label: 'Organ donor', type: 'bool' }, { key: 'discharge_disposition', label: 'Discharge disposition', type: 'select', options: DISPO } ] },
  ];
  const ALL_FIELDS = STEPS.flatMap((s) => s.fields);
  const ALL_COLS = ALL_FIELDS.map((f) => f.key);
  const OUTCOME_FIELDS = STEPS[4].fields.filter((f) => ['gos', 'gos_e', 'drs', 'rancho_level', 'mortality', 'brain_death', 'organ_donor', 'discharge_disposition'].includes(f.key));
  const INT_SELECTS = ['gos', 'gos_e'];
  /** Local helper: select-typed fields that map to integer columns are coerced before insert/update. */
  const coerce = (vals) => { INT_SELECTS.forEach((k) => { if (vals[k] != null && vals[k] !== '') vals[k] = parseInt(vals[k], 10); }); return vals; };

  /* ---------------- derived values & badges ---------------- */
  const severity = (g) => { if (g == null || g === '') return 'Unknown'; const v = +g; return v <= 8 ? 'Severe' : v <= 12 ? 'Moderate' : 'Mild'; };
  const sevTone = { Severe: 'danger', Moderate: 'warn', Mild: 'ok', Unknown: 'outline' };
  const gcsTag = (g) => g == null || g === '' ? REG.tag('—', 'outline') : REG.tag('GCS ' + g, sevTone[severity(g)]);
  const sevTag = (g) => { const s = severity(g); return REG.tag(s === 'Unknown' ? 'Unknown' : SEV_LABEL[s], sevTone[s]); };
  const marshall = (m) => m ? REG.tag('Marshall ' + m, { I: 'ok', II: 'ok', III: 'warn', IV: 'warn', V: 'danger', VI: 'danger' }[m] || 'outline') : REG.tag('—', 'outline');
  const gosTag = (g) => { if (g == null || g === '') return REG.tag('—', 'outline'); const v = +g; return REG.tag('GOS ' + v + ' · ' + (GOS_LABEL[v] || ''), v === 5 ? 'ok' : v === 4 ? 'teal' : v === 3 ? 'warn' : 'danger'); };
  const goseTag = (g) => { if (g == null || g === '') return REG.tag('—', 'outline'); const v = +g; return REG.tag('GOS-E ' + v + ' · ' + (GOSE_LABEL[v] || ''), v >= 7 ? 'ok' : v >= 5 ? 'teal' : v >= 3 ? 'warn' : 'danger'); };
  const catTag = (c) => c ? REG.tag(c, { TBI: 'info', SDH: 'teal', EDH: 'teal', 'Skull Fracture': 'outline', Penetrating: 'danger', Polytrauma: 'warn', 'SAH-Traumatic': 'info' }[c] || 'outline') : REG.tag('—', 'outline');
  const pupilTag = (p) => p ? REG.tag(p, p === 'Equal Reactive' ? 'ok' : p === 'Unequal Reactive' ? 'warn' : 'danger') : REG.tag('—', 'outline');
  const icpTag = (v) => v == null ? '—' : REG.tag(v + ' mmHg', v > 25 ? 'danger' : v > 20 ? 'warn' : 'ok');
  const died = (p) => p.mortality === 'Yes' || +p.gos === 1;
  const hadSurgery = (p) => !!p.surgery && p.surgery !== 'None';
  const unit = (v, u) => v == null || v === '' ? null : v + ' ' + u;

  const LIST_COLS = [
    { key: 'study_id', label: 'Study ID', render: (p) => REG.studyLink(p.study_id) }, { key: 'age', label: 'Age', num: true }, { key: 'sex', label: 'Sex' }, { key: 'category', label: 'Category', render: (p) => catTag(p.category) }, { key: 'mechanism', label: 'Mechanism' },
    { key: 'gcs_ed', label: 'GCS (ED)', render: (p) => gcsTag(p.gcs_ed), sortKey: (p) => p.gcs_ed == null ? 99 : +p.gcs_ed }, { key: 'marshall_class', label: 'CT', render: (p) => marshall(p.marshall_class) }, { key: 'surgery', label: 'Surgery', render: (p) => REG.val(p.surgery || 'None') },
    { key: 'gos', label: 'GOS', render: (p) => gosTag(p.gos), sortKey: (p) => p.gos == null ? 0 : +p.gos }, { key: 'mortality', label: 'Mortality', render: (p) => died(p) ? REG.tag('Yes', 'danger') : p.mortality === 'No' ? REG.tag('No', 'ok') : REG.tag('—', 'outline') },
  ];
  const CSV_COLS = ['study_id', 'category', 'age', 'sex', 'race', 'ethnicity', 'injury_date', 'mechanism', 'anticoagulation', 'gcs_field', 'gcs_ed', 'pupils', 'intubated_field', 'marshall_class', 'rotterdam_score', 'midline_shift', 'sdh_type', 'sdh_thickness', 'edh', 'edh_volume', 'fracture_type', 'fracture_location', 'surgery', 'surgery_date', 'surgeon', 'evd', 'icp_monitor_type', 'decompressive_craniectomy', 'icu_days', 'ventilator_days', 'complications', 'gos', 'gos_e', 'drs', 'rancho_level', 'mortality', 'discharge_disposition'];
  const openDetail = (p) => REG.go('detail', { id: p.study_id });
  const patients = (force) => REG.fetchAll(T, { force, order: 'study_id' });

  /* ---------------- related tables (detail) ---------------- */
  const ICP_FIELDS = [{ key: 'reading_time', label: 'Reading date / time', type: 'datetime', required: true }, { key: 'icp_value', label: 'ICP (mmHg)', type: 'number', min: 0, max: 120, required: true }, { key: 'map', label: 'MAP (mmHg)', type: 'number', min: 0, max: 250 }, { key: 'cpp', label: 'CPP (mmHg)', type: 'number', min: 0, max: 200, help: 'Left blank = MAP − ICP.' }, { key: 'interventions', label: 'Interventions', type: 'text', full: true, placeholder: 'e.g. Mannitol 20%, HOB elevation, CSF drainage' }];
  const icpChart = (el, rows) => REG.line(el, [{ label: 'ICP', color: REG.STATUS.danger, points: rows.filter((r) => r.reading_time && r.icp_value != null).map((r) => ({ x: new Date(r.reading_time), y: +r.icp_value })) }], { xTime: true, threshold: 20, thresholdLabel: 'ICP 20 mmHg', zones: [{ from: 0, to: 15, color: REG.STATUS.ok }, { from: 15, to: 20, color: REG.STATUS.warn }, { from: 20, to: 60, color: REG.STATUS.danger }], yMax: 40, yLabel: 'ICP (mmHg)', unit: 'mmHg', height: 240 });
  const REL = {
    icp: { table: 'tbi_icp_readings', title: 'ICP readings', order: 'reading_time', cols: [{ key: 'reading_time', label: 'Time', render: (r) => REG.dt(r.reading_time) }, { key: 'icp_value', label: 'ICP', num: true, render: (r) => icpTag(r.icp_value) }, { key: 'map', label: 'MAP', num: true }, { key: 'cpp', label: 'CPP', num: true, render: (r) => r.cpp == null ? '—' : (+r.cpp < 60 ? REG.tag(r.cpp, 'warn') : esc(r.cpp)) }, { key: 'interventions', label: 'Interventions' }], fields: ICP_FIELDS, chart: icpChart },
    imaging: { table: 'tbi_imaging', title: 'Imaging timeline', order: 'study_date', asc: false, cols: [{ key: 'study_date', label: 'Date', render: (r) => REG.date(r.study_date) }, { key: 'study_type', label: 'Study' }, { key: 'findings', label: 'Findings' }, { key: 'changes', label: 'Interval change' }],
      fields: [{ key: 'study_date', label: 'Study date', type: 'date', required: true }, { key: 'study_type', label: 'Study type', type: 'select', options: [['CT Head', 'CT head'], ['CT Angio', 'CT angiography'], ['MRI Brain', 'MRI brain'], ['MRA', 'MRA'], ['CTA', 'CTA']], required: true }, { key: 'findings', label: 'Findings', type: 'textarea', full: true }, { key: 'changes', label: 'Changes from prior', type: 'textarea', full: true }] },
    outcomes: { table: 'tbi_outcome_assessments', title: 'Outcome assessments', order: 'assessment_date', asc: false, cols: [{ key: 'assessment_date', label: 'Date', render: (r) => REG.date(r.assessment_date) }, { key: 'assessment_type', label: 'Instrument' }, { key: 'score', label: 'Score', render: (r) => `<strong>${REG.val(r.score)}</strong>` }, { key: 'timepoint', label: 'Timepoint' }, { key: 'notes', label: 'Notes' }],
      fields: [{ key: 'assessment_type', label: 'Instrument', type: 'select', options: [['GOS', 'GOS'], ['GOS-E', 'GOS-E'], ['DRS', 'DRS'], ['Rancho', 'Rancho Los Amigos'], ['FIM', 'FIM'], ['Other', 'Other']], required: true }, { key: 'score', label: 'Score / value', type: 'text', required: true }, { key: 'assessment_date', label: 'Assessment date', type: 'date', required: true }, { key: 'timepoint', label: 'Timepoint', type: 'select', options: ['Discharge', '3 months', '6 months', '12 months', '24 months'] }, { key: 'notes', label: 'Notes', type: 'textarea', full: true }] },
    complications: { table: 'tbi_complications', title: 'Complication log', order: 'onset_date', asc: false, cols: [{ key: 'onset_date', label: 'Onset', render: (r) => REG.date(r.onset_date) }, { key: 'complication_type', label: 'Type', render: (r) => r.complication_type ? REG.tag(r.complication_type, 'warn') : '—' }, { key: 'details', label: 'Details' }, { key: 'treatment', label: 'Treatment' }],
      fields: [{ key: 'complication_type', label: 'Complication', type: 'select', options: COMPS.concat(['Other']), required: true }, { key: 'onset_date', label: 'Onset date', type: 'date', required: true }, { key: 'details', label: 'Details', type: 'textarea', full: true }, { key: 'treatment', label: 'Treatment', type: 'textarea', full: true }] },
    followups: { table: 'tbi_follow_ups', title: 'Follow-up visits', order: 'visit_date', asc: false, cols: [{ key: 'visit_date', label: 'Date', render: (r) => REG.date(r.visit_date) }, { key: 'visit_type', label: 'Type' }, { key: 'gos_at_visit', label: 'GOS at visit', render: (r) => gosTag(r.gos_at_visit) }, { key: 'return_to_work', label: 'Return to work', render: (r) => r.return_to_work ? REG.tag(r.return_to_work, { Full: 'ok', Partial: 'warn', Unable: 'danger' }[r.return_to_work] || 'outline') : '—' }, { key: 'notes', label: 'Notes' }],
      fields: [{ key: 'visit_date', label: 'Visit date', type: 'date', required: true }, { key: 'visit_type', label: 'Visit type', type: 'select', options: [['Routine', 'Routine'], ['Neurosurgery', 'Neurosurgery clinic'], ['Rehab', 'Rehab follow-up'], ['Neuropsych', 'Neuropsychology'], ['Emergency', 'Emergency']] }, { key: 'gos_at_visit', label: 'GOS at visit', type: 'select', options: GOS }, { key: 'return_to_work', label: 'Return to work', type: 'select', options: ['Full', 'Partial', 'Unable', 'Not Applicable'] }, { key: 'notes', label: 'Notes', type: 'textarea', full: true }],
      chart: (el, rows) => { const pts = rows.filter((r) => r.visit_date && r.gos_at_visit != null).map((r) => ({ x: new Date(r.visit_date), y: +r.gos_at_visit })).sort((a, b) => a.x - b.x); if (pts.length > 1) REG.line(el, [{ label: 'GOS at visit', color: REG.TEAL, points: pts }], { xTime: true, yMin: 1, yMax: 5, yPad: false, yLabel: 'GOS', height: 180, xFormat: d3.timeFormat('%b %Y') }); else el.remove(); } },
  };

  /* ---------------- local helper: rectangular heatmap (REG.heatmap is square-only) ---------------- */
  function heatmapRect(el, matrix, rowLabels, colLabels, opts) {
    opts = opts || {};
    const max = d3.max(matrix.flat()) || 0; if (!max) { REG.chartEmpty(el, opts.empty); return; }
    const cell = 54, m = { top: 96, left: 118 }; const W = m.left + colLabels.length * cell + 90, H = m.top + rowLabels.length * cell + 8;
    const color = REG.heatScale(max);
    const svg = d3.select(el).html('').append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('width', '100%').style('max-width', W + 'px').attr('role', 'img');
    const g = svg.append('g').attr('transform', `translate(${m.left},${m.top})`);
    matrix.forEach((row, i) => row.forEach((v, j) => {
      const c = g.append('g'); c.append('rect').attr('x', j * cell).attr('y', i * cell).attr('width', cell - 3).attr('height', cell - 3).attr('rx', 4).attr('fill', v ? color(v) : REG.HEAT_EMPTY).attr('stroke', 'rgba(148,163,184,.12)');
      c.append('text').attr('class', 'cell').attr('x', j * cell + (cell - 3) / 2).attr('y', i * cell + (cell - 3) / 2).attr('text-anchor', 'middle').attr('dominant-baseline', 'middle').attr('fill', REG.heatText(v, max)).text(opts.format ? opts.format(v, i, j) : v);
      c.append('title').text(`${rowLabels[i]} × ${colLabels[j]}: ${v} patient${v === 1 ? '' : 's'}`);
    }));
    rowLabels.forEach((l, i) => g.append('text').attr('class', 'axis-label').attr('x', -8).attr('y', i * cell + cell / 2 - 1).attr('text-anchor', 'end').attr('dominant-baseline', 'middle').text(l));
    colLabels.forEach((l, j) => g.append('text').attr('class', 'axis-label').attr('x', j * cell + cell / 2 - 1).attr('y', -10).attr('text-anchor', 'start').attr('transform', `rotate(-35 ${j * cell + cell / 2 - 1} -10)`).text(l));
  }

  /* ---------------- pages ---------------- */
  const PAGES = [
    { key: 'dashboard', label: 'Dashboard', icon: 'home' }, { key: 'acute', label: 'Acute TBI', icon: 'brain' }, { key: 'subdural', label: 'Subdural', icon: 'doc' }, { key: 'fracture', label: 'Skull fracture', icon: 'shield' },
    { key: 'query', label: 'Query builder', icon: 'search' }, { key: 'add', label: 'Add patient', icon: 'plus', write: true }, { key: 'detail', label: 'Patient detail', icon: 'doc', hidden: true },
    { key: 'icp', label: 'ICP monitor', icon: 'chart' }, { key: 'outcomes', label: 'Outcomes', icon: 'award' }, { key: 'quality', label: 'Data quality', icon: 'shield' },
  ];

  /* ---------- dashboard ---------- */
  async function dashboard(el) {

  /* ---------- ICP monitor ---------- */
  async function icp(el, params) {
    const pts = await patients();
    const eligible = pts.filter((p) => p.evd === 'Yes' || p.icp_monitor_type || severity(p.gcs_ed) === 'Severe');
    const sel = params.id || '';
    el.innerHTML = `<div class="filters"><label class="small muted" for="icpPt" style="white-space:nowrap">Patient</label><select class="input" id="icpPt" style="min-width:260px"><option value="">Select a monitored patient…</option>${eligible.map((p) => `<option value="${esc(p.study_id)}" ${p.study_id === sel ? 'selected' : ''}>${esc(p.study_id)} · GCS ${esc(p.gcs_ed == null ? '?' : p.gcs_ed)} · ${esc(p.icp_monitor_type || (p.evd === 'Yes' ? 'EVD' : 'no monitor'))}</option>`).join('')}</select><span class="muted small">${eligible.length} patients with EVD, ICP monitor or severe TBI</span><span class="grow"></span>${REG.canWrite ? `<button class="btn btn-primary btn-sm" id="addIcp" ${sel ? '' : 'disabled'}>${SL.icons.plus}Add reading</button>` : ''}${REG.exportBtn()}</div><div id="icpBody" class="mt-2"></div>`;
    el.querySelector('#icpPt').onchange = (e) => REG.go('icp', { id: e.target.value }, { replace: true });

      REG.groupedBar(body.querySelector('#iType'), ['Severe', 'Moderate', 'Mild'].map((s) => ({ group: s, series: { EVD: REG.count(pts, (x) => severity(x.gcs_ed) === s && x.icp_monitor_type === 'EVD'), Bolt: REG.count(pts, (x) => severity(x.gcs_ed) === s && x.icp_monitor_type === 'Bolt'), Both: REG.count(pts, (x) => severity(x.gcs_ed) === s && x.icp_monitor_type === 'Both'), None: REG.count(pts, (x) => severity(x.gcs_ed) === s && !x.icp_monitor_type) } })), ['EVD', 'Bolt', 'Both', 'None'], { height: 230, empty: 'No data' });

      el.querySelector('[data-export]').onclick = () => REG.csvDownload('tbi_icp_monitored.csv', monitored, ['study_id', 'category', 'gcs_ed', 'icp_monitor_type', 'evd', 'hyperosmolar', 'decompressive_craniectomy', 'gos', 'mortality']);

    body.innerHTML = `<div class="flex wrap mb-2" style="align-items:center"><h3 style="margin:0">${REG.studyLink(p.study_id)}</h3>${catTag(p.category)}${gcsTag(p.gcs_ed)}${marshall(p.marshall_class)}<span class="muted small">${esc(p.icp_monitor_type || '—')} · EVD ${esc(p.evd || '—')} · ${esc(p.hyperosmolar ? p.hyperosmolar : 'no hyperosmolar')} · DC ${esc(p.decompressive_craniectomy || '—')}</span></div>` +

  }

  /* ---------- outcomes ---------- */

        ${REG.section('Severity × outcome (GOS)', '<div class="chart" id="oHeat"></div>' + REG.note('Cell = number of patients. Rows: GCS severity at ED; columns: Glasgow Outcome Scale.'))}
        ${REG.section('Discharge disposition', '<div class="chart" id="oDispo"></div>')}
        ${REG.section('Return to work (follow-up visits)', '<div class="chart" id="oRtw"></div>')}
      </div>
      <div class="chart-grid">
        ${REG.section('Favourable outcome (GOS 4-5) by category', '<div class="chart" id="oCat"></div>')}
        ${REG.section('Favourable outcome by Marshall class', '<div class="chart" id="oMarsh"></div>')}
      </div>
      ${REG.section('Outcome by severity', '<div id="oTable"></div>')}`;
    REG.donut(el.querySelector('#oGos'), [1, 2, 3, 4, 5].map((g) => ({ label: GOS_LABEL[g], value: REG.count(withGos, (p) => +p.gos === g) })), { colorFor: (l) => GOS_COLOR[l], empty: 'No GOS data' });

    heatmapRect(el.querySelector('#oHeat'), sevs.map((s) => [1, 2, 3, 4, 5].map((g) => REG.count(pts, (p) => severity(p.gcs_ed) === s && +p.gos === g))), sevs.map((s) => SEV_LABEL[s]), [1, 2, 3, 4, 5].map((g) => 'GOS ' + g + ' ' + GOS_LABEL[g]), { empty: 'No outcome data' });
    REG.donut(el.querySelector('#oDispo'), REG.toData(REG.tally(pts.filter((p) => p.discharge_disposition), 'discharge_disposition'), 'desc'), { colorFor: (l) => ({ Home: REG.STATUS.ok, Rehab: REG.SERIES[0], SNF: REG.SERIES[3], LTAC: REG.SERIES[1], Deceased: REG.STATUS.danger }[l] || REG.NEUTRAL), empty: 'No disposition data' });
    REG.donut(el.querySelector('#oRtw'), ['Full', 'Partial', 'Unable', 'Not Applicable'].map((k) => ({ label: k, value: REG.count(follow, (f) => f.return_to_work === k) })), { colorFor: (l) => ({ Full: REG.STATUS.ok, Partial: REG.STATUS.warn, Unable: REG.STATUS.danger }[l] || REG.NEUTRAL), empty: 'No return-to-work data' });
    const byCat = CAT_KEYS.map((c) => { const grp = withGos.filter((p) => p.category === c); return { label: `${c} (n=${grp.length})`, value: grp.length ? Math.round(REG.count(grp, (p) => +p.gos >= 4) / grp.length * 100) : 0 }; }).filter((d) => !d.label.includes('(n=0)'));
    REG.bar(el.querySelector('#oCat'), byCat, { color: REG.TEAL, max: 100, format: (v) => v + '%', empty: 'No GOS data by category', height: 240 });
    REG.bar(el.querySelector('#oMarsh'), ['I', 'II', 'III', 'IV', 'V', 'VI'].map((m) => { const grp = withGos.filter((p) => p.marshall_class === m); return { label: `${m} (n=${grp.length})`, value: grp.length ? Math.round(REG.count(grp, (p) => +p.gos >= 4) / grp.length * 100) : 0 }; }), { color: REG.NAVY, max: 100, format: (v) => v + '%', empty: 'No Marshall data', height: 240 });
    const tRows = sevs.concat(['Unknown']).map((s) => { const grp = pts.filter((p) => severity(p.gcs_ed) === s); const g = grp.filter((p) => p.gos != null); return { sev: s === 'Unknown' ? 'Unknown GCS' : SEV_LABEL[s], n: grp.length, dead: REG.count(grp, died), fav: REG.count(g, (p) => +p.gos >= 4), gosN: g.length, icu: REG.mean(grp.map((p) => p.icu_days)), vent: REG.mean(grp.map((p) => p.ventilator_days)), surg: REG.count(grp, hadSurgery) }; });

  }

  /* ---------- data quality ---------- */
  async function quality(el) {
    const pts = await patients();
    const cats = { Demographics: ['age', 'sex', 'race', 'ethnicity'], Injury: ['category', 'injury_date', 'mechanism', 'anticoagulation'], 'ED assessment': ['gcs_ed', 'gcs_field', 'pupils', 'sbp', 'heart_rate', 'spo2'], 'CT findings': ['marshall_class', 'rotterdam_score', 'midline_shift', 'herniation'], 'Surgery & ICP': ['surgery', 'surgery_date', 'surgeon', 'evd', 'icp_monitor_type'], 'ICU course': ['icu_days', 'ventilator_days', 'tracheostomy', 'peg_tube'], Outcomes: ['gos', 'gos_e', 'drs', 'mortality', 'discharge_disposition'] };
    const c = REG.completeness(pts, cats); const catVals = Object.values(c.catScores);
    el.innerHTML = REG.stats([REG.statCard(c.total, 'Patients'), REG.statCard(c.avg + '%', 'Average completeness', { tone: REG.scoreTone(c.avg) }), REG.statCard(catVals.filter((v) => v >= 80).length, 'Categories ≥ 80%', { tone: 'ok' }), REG.statCard(catVals.filter((v) => v < 50).length, 'Categories < 50%', { tone: 'danger' })]) +
      `<div class="chart-grid">${REG.section('Completeness by category', Object.keys(c.catScores).map((k) => `<div class="qrow"><span>${esc(k)}</span>${REG.progressBar(c.catScores[k])}<span class="pct">${c.catScores[k]}%</span></div>`).join(''))}${REG.section('Patients by completeness band', '<div class="chart" id="qPie"></div>')}</div>
      <div class="chart-grid">${REG.section('Fields below 50% coverage', '<div id="qCrit"></div>')}${REG.section('Least complete records', '<div id="qWorst"></div>')}</div>`;
    const bands = { 'Excellent (≥80%)': 0, 'Good (60–79%)': 0, 'Fair (40–59%)': 0, 'Poor (<40%)': 0 }; c.perPatient.forEach((x) => { if (x.pct >= 80) bands['Excellent (≥80%)']++; else if (x.pct >= 60) bands['Good (60–79%)']++; else if (x.pct >= 40) bands['Fair (40–59%)']++; else bands['Poor (<40%)']++; });
    REG.donut(el.querySelector('#qPie'), REG.toData(bands), { colorFor: (l) => l.startsWith('Exc') ? REG.STATUS.ok : l.startsWith('Good') ? REG.STATUS.info : l.startsWith('Fair') ? REG.STATUS.warn : REG.STATUS.danger, empty: 'No patients' });
    const crit = Object.keys(c.fieldScores).filter((f) => c.fieldScores[f] < 50).sort((a, b) => c.fieldScores[a] - c.fieldScores[b]);
    REG.table(el.querySelector('#qCrit'), [{ key: 'field', label: 'Field', render: (r) => `<code>${esc(r.field)}</code>` }, { key: 'pct', label: 'Coverage', num: true, render: (r) => r.pct + '%' }, { key: 'bar', label: '', sortable: false, render: (r) => REG.progressBar(r.pct) }], crit.map((f) => ({ field: f, pct: c.fieldScores[f] })), { empty: pts.length ? 'All fields are above 50% coverage.' : 'No patients yet.', sticky: false });
    REG.table(el.querySelector('#qWorst'), [{ key: 'study_id', label: 'Study ID', render: (r) => REG.studyLink(r.row.study_id) }, { key: 'pct', label: 'Complete', num: true, render: (r) => r.pct + '%' }, { key: 'missing', label: 'Missing', sortable: false, render: (r) => `<span class="xs muted">${esc(r.missing.slice(0, 5).join(', '))}${r.missing.length > 5 ? ` +${r.missing.length - 5}` : ''}</span>` }], c.perPatient.slice().sort((a, b) => a.pct - b.pct).slice(0, 15), { empty: 'No patients yet.', sticky: false });
  }

  await REG.init({ registry: 'tbi', title: 'Trauma / TBI Registry', subtitle: 'TBI · subdural & epidural hematoma · skull fracture · ICP monitoring · GOS / GOS-E outcomes', prefix: PREFIX, table: T, pages: PAGES, defaultPage: 'dashboard',
